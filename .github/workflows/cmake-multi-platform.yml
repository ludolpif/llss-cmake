name: CMake on multiple platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
        cfg: [RelWithDebInfo]
        include:
          - os: windows-2025-vs2026
            platform: windows-10-or-11
            cmake_generator: Visual Studio 18 2026
            arch_flags: /arch:AVX2
            sdl: 3.4.14
            sdl-image: 3.4.4
          - os: ubuntu-24.04
            platform: linux-x86-64-v3-glibc6-2-39-libstdcxx-13-2
            cmake_generator: Ninja Multi-Config
            sdl: 3.2.10
            sdl-image: 3.2.4
          - os: macos-26
            platform: macos-26
            cmake_generator: Xcode
            arch_flags:
            sdl: 3.4.14
            sdl-image: 3.4.4
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Export some shell-only vars to env
      shell: bash
      run: |
        echo "ImageOS=$ImageOS" >> $GITHUB_ENV
        echo "ImageVersion=$ImageVersion" >> $GITHUB_ENV
        echo "CACHE_DISCRIMINATOR=$ImageOS-$ImageVersion-${{ matrix.cfg }}" >> $GITHUB_ENV

    - name: Export CMAKE_* vars to ENV configure both SDL and LLSS builds
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cat >> $GITHUB_ENV <<EOT
          CMAKE_C_FLAGS=-march=x86-64-v3
          CMAKE_CXX_FLAGS=-march=x86-64-v3
        EOT

    - name: Export CMAKE_* vars to ENV configure both SDL and LLSS builds
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cat >> $GITHUB_ENV <<EOT
          CMAKE_SYSTEM_NAME=Windows
          CMAKE_SYSTEM_VERSION="10.0"
          CMAKE_C_FLAGS=/arch:AVX2
          CMAKE_CXX_FLAGS=/arch:AVX2
        EOT

    - name: Export CMAKE_* vars to ENV configure both SDL and LLSS builds
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cat >> $GITHUB_ENV <<EOT
          CMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        EOT

    - name: Setup SDL
      if: runner.os == 'Linux'
      run: |
        curl -Lfo SystemLibs.zip https://ludolpif.fr/pub/llss/artifacts/build-dep-0.6.2.0-ubuntu-noble-SystemLibs.zip
        unzip -qo SystemLibs.zip
        rm -f SystemLibs.zip
        sudo dpkg -i lib/platform/sdl3-deb/libsdl3-*.deb || true
        sudo apt-get update
        sudo apt-get install -f

    - name: Setup SDL
      if: runner.os != 'Linux'
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        build-type: ${{ matrix.cfg }}
        cmake-arguments: >-
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF
        cmake-generator: ${{ matrix.cmake_generator }}
        discriminator: ${{ env.CACHE_DISCRIMINATOR }}
        install-linux-dependencies: true
        version: ${{ matrix.sdl }}
        version-sdl-image: ${{ matrix.sdl-image }}
        version-sdl-ttf: 3-latest

    - name: Dump env and steps
      env:
        STEPS_JSON: ${{ toJSON(steps) }}
      shell: bash
      run: env

    - name: Configure CMake
      run: cmake -S . -B ./build -G "${{ matrix.cmake_generator }}"

    - name: Build
      run: cmake --build ./build --config ${{ matrix.cfg }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config ${{ matrix.cfg }}

    - name: Install
      run: cmake --install ./build --config ${{ matrix.cfg }} --prefix ./install/${{ matrix.cfg }}

    - name: Ad-Hoc Codesign
      if: runner.os == 'macOS'
      run: codesign -s - -f "./build/release/llss.app" --deep

    - name: Create DMG
      if: runner.os == 'macOS'
      working-directory: ${{ github.workspace }}/build
      run: hdiutil create -size 2g -srcfolder release -volname llss llss.dmg

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: llss-0.X.Y.Z-${{ matrix.platform }}-sdl${{ matrix.sdl }}-${{ matrix.cfg }}
        path: |
          ./build/${{ matrix.cfg }}
          ./install/${{ matrix.cfg }}
        retention-days: 5
