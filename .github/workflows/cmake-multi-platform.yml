name: CMake on multiple platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the cfg list.
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-15-intel, macos-26]
        cfg: [RelWithDebInfo]
        include:
          - os: windows-2025-vs2026
            platform: windows
            cmake_generator: Visual Studio 18 2026
            c_compiler: cl
            cxx_compiler: cl
            c_flags: /arch:AVX2
            cxx_flags: /arch:AVX2
            sdl: 3.4.14
            sdl-image: 3.4.4
            sdl-ttf: 3.2.2
          - os: ubuntu-26.04
            platform: linux-x86-64-v3-glibc6-2-43-libstdcxx-16
            cmake_generator: Ninja Multi-Config
            c_compiler: gcc
            cxx_compiler: g++
            c_flags: -march=x86-64-v3
            cxx_flags: -march=x86-64-v3
            sdl: 3.2.10
            sdl-image: 3.2.4
            sdl-ttf: 3.2.2
          - os: macos-15-intel
            platform: macos-15-intel
            cmake_generator: Xcode
            c_compiler: clang
            cxx_compiler: clang++
            c_flags:
            cxx_flags:
            sdl: 3.2.10
            sdl-image: 3.2.4
            sdl-ttf: 3.2.2
          - os: macos-26
            platform: macos-26-arm64
            cmake_generator: Xcode
            c_compiler: clang
            cxx_compiler: clang++
            c_flags:
            cxx_flags:
            sdl: 3.4.14
            sdl-image: 3.4.4
            sdl-ttf: 3.2.2

    steps:
    - uses: actions/checkout@v7

#    - name: Install Linux Deps
#      if: runner.os == 'Linux'
#      run: |
#        sudo apt-get update
#        sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev

    - name: Setup SDL
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        install-linux-dependencies: true
        version: ${{ matrix.sdl }}
        version-sdl-image: ${{ matrix.sdl-image }}
        version-sdl-ttf: ${{ matrix.sdl-ttf }}

    - name: Configure CMake
      #working-directory: ${{ github.workspace }}
      env:
        SDL3_DIR: ${{ steps.sdl.outputs.prefix }}
      run: >
        cmake -B ./build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_C_FLAGS=${{ matrix.c_flags }}
        -DCMAKE_CXX_FLAGS=${{ matrix.cxx_flags }}
        -S .

    - name: Build
      #working-directory: ${{ github.workspace }}
      run: cmake --build ./build --config ${{ matrix.cfg }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config ${{ matrix.cfg }}

    - name: Install
      #working-directory: ${{ github.workspace }}
      run: cmake --install ./build --config ${{ matrix.cfg }} --prefix ${{ github.workspace }}/install/${{ matrix.cfg }}

    - name: Upload artifact
      #working-directory: ${{ github.workspace }}
      uses: actions/upload-artifact@v7
      with:
        name: llss-0.X.Y.Z-${{ matrix.platform }}-sdl${{ matrix.sdl }}-${{ matrix.cfg }}
        path: ./install/${{ matrix.cfg }}
        retention-days: 5
