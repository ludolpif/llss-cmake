name: CMake on multiple platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the cfg list.
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
        cfg: [RelWithDebInfo]
        include:
          - os: windows-2025-vs2026
            platform: windows-10-or-11
            cmake_generator: Visual Studio 18 2026
            arch_flags: /arch:AVX2
            sdl: 3.4.14
            sdl-image: 3.4.4
          - os: ubuntu-24.04
            platform: linux-x86-64-v3-glibc6-2-39-libstdcxx-13-2
            cmake_generator: Ninja Multi-Config
            arch_flags: -march=x86-64-v3
            sdl: 3.2.10
            sdl-image: 3.2.4
          - os: macos-26
            platform: macos-26
            cmake_generator: Xcode
            arch_flags:
            sdl: 3.4.14
            sdl-image: 3.4.4

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Make some shell-only vars globally available
      shell: bash
      run: |
        echo "ImageOS=$ImageOS" >> $GITHUB_ENV
        echo "ImageVersion=$ImageVersion" >> $GITHUB_ENV

    - name: Prepare some reusable strings
      shell: bash
      run: |
        echo "CACHE_DISCRIMINATOR=$ImageOS-$ImageVersion-${{ matrix.cfg }}" >> $GITHUB_ENV

    - name: Setup SDL
      if: runner.os != 'Linux'
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        build-type: ${{ matrix.cfg }}
        cmake-arguments: >-
          -DCMAKE_C_FLAGS=${{ matrix.arch_flags }}
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF
        cmake-generator: ${{ matrix.cmake_generator }}
        discriminator: ${{ env.CACHE_DISCRIMINATOR }}
        install-linux-dependencies: true
        version: ${{ matrix.sdl }}
        version-sdl-image: ${{ matrix.sdl-image }}
        version-sdl-ttf: 3-latest

    - name: Setup SDL
      if: runner.os == 'Linux'
      id: sdl
      shell: bash
      run: |
        sudo apt update
        sudo apt install libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev
        echo "prefix=" >> $GITHUB_OUTPUT

    - name: Dump env and steps
      env:
        STEPS_JSON: ${{ toJSON(steps) }}
      shell: bash
      run: env

    - name: Configure CMake
      #working-directory: ${{ github.workspace }}
      run: >-
        cmake -S . -B ./build -G ${{ matrix.cmake_generator }}
        -DCMAKE_C_FLAGS=${{ matrix.arch_flags }}
        -DCMAKE_CXX_FLAGS=${{ matrix.arch_flags }}
        -DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}

    - name: Build
      run: cmake --build ./build --config ${{ matrix.cfg }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config ${{ matrix.cfg }}

    - name: Install
      run: cmake --install ./build --config ${{ matrix.cfg }} --prefix ./install/${{ matrix.cfg }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: llss-0.X.Y.Z-${{ matrix.platform }}-sdl${{ matrix.sdl }}-${{ matrix.cfg }}
        path: |
          ./build/${{ matrix.cfg }}
          ./install/${{ matrix.cfg }}
        retention-days: 5
