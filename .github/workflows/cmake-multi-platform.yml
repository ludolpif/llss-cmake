name: CMake on multiple platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the cfg list.
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-15-intel, macos-26]
        cfg: [RelWithDebInfo]
        include:
          - os: windows-2025-vs2026
            platform: windows-10-or-11
            cmake_generator: Visual Studio 18 2026
            arch_flags: /arch:AVX2
            sdl: 3.4.14
          - os: ubuntu-24.04
            platform: linux-x86-64-v3-glibc6-2-39-libstdcxx-13-2
            cmake_generator: Ninja Multi-Config
            arch_flags: -march=x86-64-v3
            sdl: 3.2.10
          - os: macos-15-intel
            platform: macos-15-intel
            cmake_generator: Xcode
            arch_flags:
            sdl: 3.2.10
          - os: macos-26
            platform: macos-26-arm64
            cmake_generator: Xcode
            arch_flags:
            sdl: 3.4.14

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Make some shell vars globally available
      run: |
        echo "ImageOS=${ImageOS}" >> $GITHUB_ENV
        echo "ImageVersion=${ImageVersion}" >> $GITHUB_ENV

    - name: Setup SDL (${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ matrix.cfg }})
      id: sdl
      uses: libsdl-org/setup-sdl@main
      with:
        build-type: ${{ matrix.cfg }}
        cmake-arguments: >-
          -DCMAKE_C_FLAGS=${{ matrix.arch_flags }}
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF
        cmake-generator: ${{ matrix.cmake_generator }}
        discriminator: ${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ matrix.cfg }}
        #cmake-toolchain-file:
        install-linux-dependencies: true
        version: ${{ matrix.sdl }}
        version-sdl-image: 3-latest
        version-sdl-mixer: 3-latest
        version-sdl-net: 3-latest
        version-sdl-ttf: 3-latest

    - name: Dump env and steps
      env:
        STEPS_JSON: ${{ toJSON(steps) }}
      shell: bash
      run: env

    - name: Configure CMake
      #working-directory: ${{ github.workspace }}
      run: >-
        cmake -B ./build
        -DCMAKE_C_FLAGS=${{ matrix.arch_flags }}
        -DCMAKE_CXX_FLAGS=${{ matrix.arch_flags }}
        -DCMAKE_PREFIX_PATH=${{ steps.sdl.outputs.prefix }}
        -S .

    - name: Build
      #working-directory: ${{ github.workspace }}
      run: cmake --build ./build --config ${{ matrix.cfg }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config ${{ matrix.cfg }}

    - name: Install
      #working-directory: ${{ github.workspace }}
      run: cmake --install ./build --config ${{ matrix.cfg }} --prefix ${{ github.workspace }}/install/${{ matrix.cfg }}

    - name: Upload artifact
      #working-directory: ${{ github.workspace }}
      uses: actions/upload-artifact@v7
      with:
        name: llss-0.X.Y.Z-${{ matrix.platform }}-sdl${{ matrix.sdl }}-${{ matrix.cfg }}
        path: ./install/${{ matrix.cfg }}
        retention-days: 5
